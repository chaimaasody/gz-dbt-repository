version: 2

sources:
  - name: raw
    description: Raw dataset containing Greenweez source tables.
    schema: gz_raw_data

    tables:
      - name: sales
        identifier: raw_gz_sales
        description: Sales of Greenweez. One row corresponds to one product purchased in an order.

        columns:
          - name: date_date
            description: Date of purchase.

          - name: orders_id
            description: Order identifier.

          - name: pdt_id
            description: Product identifier.

          - name: revenue
            description: Revenue generated by the product.

          - name: quantity
            description: Quantity sold.

        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: Greenweez products.

        columns:
          - name: products_id
            description: Product identifier.
            tests:
              - not_null
              - unique

          - name: purchse_price
            description: Purchase price of the product.

      - name: ship
        identifier: raw_gz_ship
        description: Shipping information.

        columns:
          - name: orders_id
            description: Order identifier.
            tests:
              - not_null
              - unique

          - name: shipping_fee
            description: Shipping fee.

          - name: shipping_fee_1
            description: Duplicate shipping fee column.

          - name: logcost
            description: Logistics cost.

          - name: ship_cost
            description: Shipping cost.